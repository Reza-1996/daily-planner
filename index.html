<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="برنامه روزانه با قابلیت یادآوری" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>برنامه روزانه</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Favicon / Icons -->
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Font -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1>برنامه روزانه</h1>
      <p id="today-date" class="date"></p>
    </header>

    <!-- Add Task Form -->
    <section class="add-section">
      <div class="form-card">
        <input type="text" id="task-title" placeholder="عنوان کار را بنویسید..." maxlength="80" />
        <div class="time-row">
          <input type="time" id="task-time" />
          <label class="checkbox-label">
            <input type="checkbox" id="enable-reminder" checked />
            <span>یادآوری</span>
          </label>
        </div>
        <button id="add-btn" class="btn-primary">افزودن کار</button>
      </div>
    </section>

    <!-- Tasks List -->
    <section class="tasks-section">
      <div class="section-header">
        <h2>کارهای امروز</h2>
        <span id="task-count" class="badge">0</span>
      </div>
      <div id="tasks-list" class="tasks-list">
        <!-- Tasks will be rendered here -->
      </div>
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">📝</div>
        <p>هنوز کاری ثبت نشده</p>
        <p class="hint">اولین کار امروزت رو اضافه کن</p>
      </div>
    </section>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
